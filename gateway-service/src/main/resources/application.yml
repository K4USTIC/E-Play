server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: compras-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/compras/**

        - id: usuarios-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/usuarios/**

        - id: juegos-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/juegos/**
