server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: compras-service
          uri: ${COMPRAS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/compras/**

        - id: usuarios-service
          uri: ${USUARIOS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/usuarios/**

        - id: juegos-service
          uri: ${JUEGOS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/juegos/**
