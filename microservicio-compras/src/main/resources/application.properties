# Puerto del servidor
server.port=8081
spring.application.name=microservicio-compras

# Configuración de Base de Datos H2 (En memoria)
spring.datasource.url=jdbc:h2:mem:comprasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola de H2 en el navegador (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway (Migraciones automáticas)
spring.flyway.enabled=true