server.port=8081
spring.application.name=microservicio-compras

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eplay_compras}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eplay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eplay_dev_password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=true
